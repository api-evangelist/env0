  purpose: apply consistent tags across Terraform/Terragrunt AWS, Azure and GCP resources
  repo: https://github.com/env0/terratag
  version: v0.7.7
  docs: https://docs.envzero.com/guides/community-and-resources/community-and-open-source/terratag
