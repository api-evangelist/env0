summary:
  official_packages: 8
  official_client_libraries: 2
  client_libraries:
  - env0/env0 (Terraform provider, Go, a first-party client of api.env0.com)
  - '@env0/backstage-plugin-env0 (TypeScript)'
  generic_rest_sdk: false
  note: >-
    env zero ships NO conventional general-purpose REST SDK (no PyPI, RubyGems, NuGet, Maven or
    crates.io package, and nothing on npm beyond the CLI and the Backstage plugin). What it does
    ship, all first-party: a single-binary CLI on Homebrew and npm, a Terraform provider that is
    itself a client of api.env0.com and by far the most-used surface (9.35M downloads), an MCP
    server distributed as a container, a Backstage plugin, and a Helm chart for the self-hosted
    agent. A developer wanting to call the REST API from an arbitrary language writes the HTTP
    calls themselves.
