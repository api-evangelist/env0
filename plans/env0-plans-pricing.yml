note: >-
  env zero publishes THREE named tiers and a real, complete quota table for the Free tier, but
  publishes NO price for either paid tier - both say "Pricing per Apply or Environment - get a
  free quote". So the tier structure and the limits are public; the money is sales-gated. The
  billing metric itself is disclosed (per Apply or per Environment), which is more than most
  IaC platforms publish.
