  run_definition: one successful deploy, destroy or drift detection. Plans, PR plans, dry runs,
    tasks, module tests and failed or cancelled runs do not count.
  overage: none
  overage_behavior: >-
    At 30 active environments you cannot create new environments until you destroy one or mark it
    inactive; existing ones keep deploying. At 250 runs, user-triggered deploys/destroys/drift are
    BLOCKED and unattended runs (continuous deployment, scheduled deployments, drift remediation,
    TTL destroys) are SKIPPED SILENTLY with no notification.
  support: community
  includes:
  - every Cloud Navigator feature including drift detection and OIDC/SSO
  - Cloud Compass (one cloud account)
