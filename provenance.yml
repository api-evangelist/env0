    evidence: >-
      CORRECTED 2026-09-06. Previously recorded as `harvested`. The file is NOT a provider
      document: its own info.description says "Best-effort spec derived from publicly documented
      surfaces; not exhaustive", and its operationIds do not match env zero's. For
      /users/me/vcs-provider-user-mappings this file says `getUserVcsProviderMappings` while env
      zero's own reference says `users-get-vcs-provider-user-mappings`. It covers 14 operations
      against the 327 env zero publishes at https://docs.envzero.com/api-reference. env zero
      serves no raw OpenAPI: /api-reference/openapi.yml (advertised in its own llms.txt) 404s,
      and /api-reference/openapi.json returns Mintlify's default "OpenAPI Plant Store" sample.
      Every openapi/*.yml in this repo is a tag-split of this generated file and inherits the
      same provenance.
