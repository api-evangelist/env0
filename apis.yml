aid: env0
name: Env0
description: >-
  env0 -- now trading as "env zero" -- is an infrastructure-as-code automation and cloud
  governance platform for Terraform, OpenTofu, Terragrunt, Pulumi, CloudFormation, Kubernetes
  and Helm. It provisions and manages cloud environments from reusable templates, orchestrates
  multi-environment workflows with dependencies, enforces custom approval and guardrail
  policies, detects and remediates infrastructure drift, runs a private module and provider
  registry, and adds cost estimation, actual-cost visibility and budget thresholds on top.
  The public REST API at https://api.env0.com publishes 327 operations across 30 areas and
  authenticates with HTTP Basic using an API Key ID and Secret. env zero also ships a
  first-party CLI, a Terraform provider, an official MCP server, a published Agent Skill and a
  conformant A2A agent card.
