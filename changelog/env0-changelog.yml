note: >-
  env zero publishes a dated, per-release changelog organised by month and year, 119 pages deep,
  going back to 2022. It is a PRODUCT changelog, not an API changelog: entries describe features,
  and API additions surface only where a feature adds endpoints (SCIM, bulk operations). There is
  no separate API version history and no breaking-change register for the REST surface.
