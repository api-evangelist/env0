method: searched
source: https://docs.envzero.com (guides + API reference), https://docs.envzero.com/guides/overview/security-overview
note: >-
  Assertions below come from env zero's own published surfaces. Where a standard is claimed only
  in prose it is marked as such; where the contract itself declares the standard (SCIM discovery
  endpoints, CloudEvents webhook envelope) the evidence names the exact location.
standards:
- id: scim-2.0
  name: SCIM 2.0 (RFC 7643 / RFC 7644)
  conforms: true
  domain_standard: true
  evidence: >-
    env zero publishes the SCIM self-describing discovery triple - /scim/v2/ServiceProviderConfig,
    /scim/v2/ResourceTypes and /scim/v2/Schemas - and documents "For any other IdP that supports
    SCIM 2.0, point it at the same endpoint with the bearer token in the Authorization header."
    Provisioning modes, group push to env zero teams, token rotation with a 24h grace window and a
    reconcile/diff job are all exposed as REST operations under the Users section of the reference.
  evidence_url: https://docs.envzero.com/guides/sso-integrations/scim-provisioning#set-up-scim
  supported_features: [filtering, discovery endpoints, group push, token rotation]
  unsupported_features: [sorting, bulk operations, ETags]
  unsupported_note: env zero states these plainly rather than leaving them to be discovered -
    "Filtering is supported; sorting, bulk operations, and ETags are not."
  certified_integrations: [Okta, Microsoft Entra ID]
  ga_date: '2026-08'
- id: cloudevents-1.0
  name: CloudEvents 1.0
  conforms: true
  domain_standard: true
  evidence: >-
    Every webhook delivery uses the CloudEvents structured JSON envelope - type, source, id, time,
    datacontenttype, data - with reverse-DNS event types (com.env-zero.deploy.succeeded). The
    binding is CloudEvents-SHAPED rather than a declared CloudEvents implementation - env zero
    does not name the specification, and it does not send the ce-* HTTP binding headers, using
    its own x-env-zero-event / x-env-zero-event-id / x-env-zero-signature instead.
  evidence_url: https://docs.envzero.com/guides/integrations/notifications/webhooks
  caveat: shape matches; conformance is not claimed by the provider
- id: oidc
  name: OpenID Connect
  conforms: true
  evidence: >-
    env zero acts as an OIDC IDENTITY PROVIDER for outbound workload identity - issuing JWTs that
    AWS, Azure, GCP and HashiCorp Vault trust, with per-cloud-provider audiences since July 2026
    (V2 OIDC tokens). It is also an OIDC RELYING PARTY for Azure AD sign-in. It does NOT serve
    /.well-known/openid-configuration on any host probed 2026-09-06 (env0.com, www.env0.com,
    envzero.com, www.envzero.com, api.env0.com, docs.envzero.com, app.env0.com all 404 or
    return an SPA shell).
  evidence_url: https://docs.envzero.com/guides/integrations/oidc-integrations
- id: saml-2.0
  name: SAML 2.0
  conforms: true
  evidence: self-service SSO supports SAML 2.0 with any compliant IdP (Okta, OneLogin, Google
    Workspace, JumpCloud) plus Azure AD / Microsoft Entra ID
  evidence_url: https://docs.envzero.com/guides/sso-integrations/self-service-sso
- id: oauth2
  name: OAuth 2.0
  conforms: partial
  evidence: >-
    OAuth is used for VCS connections (GitHub.com, GitLab.com, Bitbucket.org) and for Azure AD
    sign-in. The env zero REST API itself does NOT use OAuth - it uses HTTP Basic with an API Key
    ID and Secret. No oauth2 securityScheme, no authorization/token endpoint, no scopes.
