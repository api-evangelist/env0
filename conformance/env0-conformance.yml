compliance:
  published: true
  page: https://docs.envzero.com/guides/overview/security-overview
  certifications:
  - name: SOC 2 Type II
    scope: entire service offering
    latest_report_issued: '2025-11'
    availability: on request from your account manager
    also_bundled_in: Cloud Navigator tier ("SOC 2 Report access")
  note: >-
    SOC 2 Type II is the only named attestation. No ISO 27001, no PCI DSS, no HIPAA, no FedRAMP,
    no GDPR page, no CSA STAR entry, and no trust portal was found. The report is not
    self-serve - it is gated behind an account manager.
  hosting: AWS (multi-account isolation, API Gateway + CloudFront + WAF at the edge, AWS SSO with
    MFA for internal access)
  encryption: HTTPS/SSH in transit; S3/RDS/DynamoDB encryption at rest; sensitive variables
    encrypted and not readable by the customer, their team, or env zero employees
  isolation: each deployment runs in a single-use sandboxed Docker container, destroyed after the
    run; self-hosted agent option keeps secrets and runs in the customer's own cloud account
  disclosed_risks: >-
    env zero publishes a candid "Possible Exploits" section naming three risks it explicitly does
    NOT mitigate - malicious code in a linked VCS repo exfiltrating data during PR plans,
    malicious third-party Terraform providers/modules reaching state and secrets, and arbitrary
    code execution through custom flows. Publishing an un-mitigated risk register is rare and
    worth crediting.
